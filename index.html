'use strict';
const STORE='mksteel_v2', statuses=['Enquiries','Planning','In Manufacture','Manufacture Complete','Awaiting Galvanising','At Galvanisers','Awaiting Powder Coating','At Powder Coaters','Ready for Installation','Installed','Invoiced'];
const fields=[['client','Client Name'],['quote','Quote / Invoice No.'],['site','Site Address'],['enquiryDate','Enquiry Date','date'],['appointmentDate','Appointment Date','date'],['contact','Contact Name'],['phone','Tel Number','tel'],['email','Email Address','email'],['requiredDate','Date Required','date'],['materials','Materials','select',['Not specified','Customer supplied','To order','Ordered','In stock']],['galvanising','Galvanising','select',['Not required','Required','Booked','Complete']],['powder','Powder Coating and Colour'],['deliverVia','Deliver Via','select',['Not decided','Company vehicle','Courier','Customer collection']],['deliveryType','Delivered / Collected / Fitted','select',['Not decided','Delivered','Collected','Fitted']],['deposit','Deposit Required','select',['Not decided','Yes','No','Received']],['tracking','Steel Tracking No.'],['description','Description – material used','textarea'],['colour','Colour / Label'],['column','Column','select',statuses],['design','Design','select',['Workshop JOB Card','Site Job Card','Enquiry Card']]];
const blank=()=>({jobs:[],notifications:[],audit:[],seq:{},customers:[]});
let data;try{data=JSON.parse(localStorage.getItem(STORE))||blank()}catch{data=blank()}for(const k of Object.keys(blank()))if(!data[k])data[k]=blank()[k];
let actor='Morgan',view='dashboard',editing=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(STORE,JSON.stringify(data));const now=()=>new Date().toLocaleString('en-GB');const today=()=>new Date().toISOString().slice(0,10);const jobTitle=j=>esc(j.client||'Unnamed customer');const addressLink=s=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s);function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2700)}
function addEvent(type,job,detail,who=actor){data.audit.unshift({type,job,detail,who,at:now(),id:crypto.randomUUID()})}function notify(type,job,detail){data.notifications.unshift({id:crypto.randomUUID(),type,job,detail,at:now(),read:false});}function nextNumber(){let y=new Date().getFullYear();data.seq[y]=(data.seq[y]||0)+1;return `MK-${y}-${String(data.seq[y]).padStart(3,'0')}`}
function setView(v,id=null){view=v;editing=id;render();window.scrollTo(0,0)}
function jobCard(j){return `<div class="job"><div class="flex"><strong>${esc(j.number)}</strong><span class="pill ${j.review?'warn':''}">${esc(j.column)}</span></div><p><b>${jobTitle(j)}</b></p><p class="muted">${esc(j.description||'No description yet').slice(0,115)}</p><p class="small">Fabricators: ${esc((j.fabricators||[]).join(', ')||'Unallocated')} ${j.lead?'· Lead: '+esc(j.lead):''}</p>${j.review?'<span class="pill warn">Awaiting Morgan’s review</span>':''}<div class="actions"><button onclick="setView('detail','${j.id}')">Open job</button>${j.site?`<a class="btn secondary" target="_blank" rel="noopener" href="${esc(addressLink(j.site))}">📍 Directions</a>`:''}</div></div>`}
function dashboard(){let review=data.jobs.filter(j=>j.review),active=data.jobs.filter(j=>!['Installed','Invoiced'].includes(j.column));return `<h2>Dashboard</h2><div class="stats"><div class="stat"><b>${active.length}</b><span class="muted">Active jobs</span></div><div class="stat"><b>${review.length}</b><span class="muted">To review</span></div><div class="stat"><b>${data.notifications.filter(n=>!n.read).length}</b><span class="muted">Alerts</span></div></div><div class="actions"><button onclick="setView('form')">+ New job / enquiry</button><button class="secondary" onclick="setView('board')">T-card board</button></div>${actor==='Morgan'?`<div class="panel ${review.length?'review':''}"><h3>Enquiries awaiting your review</h3>${review.length?review.map(jobCard).join(''):'<p class="muted">Nothing awaiting review.</p>'}</div>`:''}<div class="panel"><h3>Current jobs</h3>${active.length?active.slice(0,15).map(jobCard).join(''):'<div class="empty">No jobs yet. Create your first job card.</div>'}</div><div class="notice">Prototype: switching between Morgan and John is for testing only. This is not a secure employee login. Data is saved in this browser, not shared between phones.</div>`}
function jobsPage(){return `<div class="titlebar"><h2>Jobs</h2><button onclick="setView('form')">+ New</button></div><div class="panel"><input id="jobsearch" placeholder="Search job, client or address" oninput="filterJobs()"><div id="joblist">${data.jobs.map(jobCard).join('')||'<div class="empty">No jobs yet.</div>'}</div></div>`}function filterJobs(){let q=$('jobsearch').value.toLowerCase();$('joblist').innerHTML=data.jobs.filter(j=>[j.number,j.client,j.site,j.description].join(' ').toLowerCase().includes(q)).map(jobCard).join('')||'<p class="muted">No matching jobs</p>'}
function board(){return `<div class="titlebar"><h2>T-card board</h2><button onclick="setView('form')">+ New</button></div><p class="muted">Swipe sideways to see every stage. Tap a card to open it.</p><div class="board">${statuses.map(s=>`<div class="lane"><h3>${esc(s)} <span class="count">${data.jobs.filter(j=>j.column===s).length}</span></h3>${data.jobs.filter(j=>j.column===s).map(j=>`<div class="job" onclick="setView('detail','${j.id}')"><b>${esc(j.number)}</b><p>${jobTitle(j)}</p><span class="small">${esc((j.fabricators||[]).join(' + ')||'Unallocated')}</span>${j.review?'<p class="pill warn">Review needed</p>':''}</div>`).join('')}</div>`).join('')}</div>`}
function inputField([key,label,type='text',options],j){let val=j?.[key]??(key==='enquiryDate'?today():'');if(key==='column')val=j?.column||'Enquiries';return `<div><label for="f_${key}">${esc(label)}</label>${type==='textarea'?`<textarea id="f_${key}" name="${key}">${esc(val)}</textarea>`:type==='select'?`<select id="f_${key}" name="${key}">${options.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="f_${key}" name="${key}" type="${type}" value="${esc(val)}" ${key==='client'?'required':''}></input>`}</div>`}
function form(){let j=data.jobs.find(j=>j.id===editing);return `<div class="titlebar"><h2>${j?'Edit job card':'New job card'}</h2><button class="secondary" onclick="setView('${j?'detail':'jobs'}'${j?`,'${j.id}'`:''})">Close</button></div><div class="panel"><form id="jobform" onsubmit="submitJob(event)"><p class="muted">Job No: <b>${esc(j?.number||'Automatically generated when saved')}</b></p><div class="grid">${fields.slice(0,8).map(f=>inputField(f,j)).join('')}</div><div class="section"><h3>Manufacture & delivery</h3><div class="grid">${fields.slice(8,16).map(f=>inputField(f,j)).join('')}</div>${inputField(fields[16],j)}</div><div class="section"><h3>Allocation & tracking</h3><label>Allocated fabricators</label><div class="checks">${['Morgan','John'].map(n=>`<label><input type="checkbox" name="fabricator" value="${n}" ${(j?.fabricators||[]).includes(n)?'checked':''}>${n}</label>`).join('')}</div><label for="lead">Lead fabricator</label><select name="lead" id="lead"><option value="">Not assigned</option>${['Morgan','John'].map(n=>`<option ${j?.lead===n?'selected':''}>${n}</option>`).join('')}</select><div class="grid">${fields.slice(17).map(f=>inputField(f,j)).join('')}</div><label for="notes">Additional notes / measurements</label><textarea id="notes" name="notes">${esc(j?.notes||'')}</textarea></div><div class="notice">John's new enquiries automatically go to Morgan for review. All edits are recorded in the in-app history.</div><div class="actions"><button type="submit">Save job card</button><button type="button" class="secondary" onclick="setView('jobs')">Cancel</button></div></form></div>`}
function submitJob(e){e.preventDefault();let fd=new FormData(e.target),id=editing,j=data.jobs.find(x=>x.id===id),values={};for(const [key] of fields)values[key]=String(fd.get(key)||'').trim();values.notes=String(fd.get('notes')||'').trim();values.fabricators=fd.getAll('fabricator');values.lead=String(fd.get('lead')||'');if(values.lead&&!values.fabricators.includes(values.lead))values.fabricators.push(values.lead);if(!values.client){toast('Client name is required');return}if(!j){j={id:crypto.randomUUID(),number:nextNumber(),createdBy:actor,createdAt:now(),review:actor==='John',reviewedAt:null};Object.assign(j,values);data.jobs.unshift(j);addEvent('Job created',j.number,`${actor} created job for ${j.client}`);if(actor==='John')notify('New enquiry for review',j.number,`John created ${j.client}. Morgan must review it.`);toast('Job card created')}else{let changes=Object.keys(values).filter(k=>JSON.stringify(j[k])!==JSON.stringify(values[k]));for(const k of changes){let old=Array.isArray(j[k])?j[k].join(', '):j[k];let next=Array.isArray(values[k])?values[k].join(', '):values[k];addEvent('Job updated',j.number,`${k}: “${old??''}” → “${next??''}”`)}Object.assign(j,values);if(actor==='John'&&changes.length){notify('John changed a job',j.number,`${changes.length} field(s) changed: ${changes.join(', ')}`)}toast('Job card updated')}save();setView('detail',j.id)}
function detail(){let j=data.jobs.find(x=>x.id===editing);if(!j)return jobsPage();let history=data.audit.filter(x=>x.job===j.number);return `<div class="titlebar"><h2>${esc(j.number)}</h2><button class="secondary" onclick="setView('jobs')">Back</button></div><div class="panel"><div class="flex"><h3>${jobTitle(j)}</h3><span class="pill">${esc(j.column)}</span></div>${j.review?`<div class="notice">Awaiting Morgan's review. ${actor==='Morgan'?`<button onclick="approve('${j.id}')">Mark reviewed</button>`:'Morgan will review this enquiry.'}</div>`:''}<p>${esc(j.description||'No description added')}</p><p class="muted">Created by ${esc(j.createdBy)} · ${esc(j.createdAt)}</p><p><b>Allocated:</b> ${esc((j.fabricators||[]).join(', ')||'None')}<br><b>Lead:</b> ${esc(j.lead||'Not assigned')}</p><p><b>Site:</b> ${esc(j.site||'Not entered')}</p>${j.site?`<a class="btn" href="${esc(addressLink(j.site))}" target="_blank" rel="noopener">📍 Get Google Maps directions</a>`:''}<div class="actions"><button onclick="setView('form','${j.id}')">Edit job card</button></div><div class="section"><h3>Change job stage</h3><select id="stage">${statuses.map(s=>`<option ${j.column===s?'selected':''}>${esc(s)}</option>`).join('')}</select><button style="margin-top:10px" onclick="changeStage('${j.id}')">Update stage</button></div><div class="section"><h3>Job information</h3>${fields.filter(f=>!['client','column','description'].includes(f[0])).map(([k,label])=>`<p class="small"><b>${esc(label)}:</b> ${esc(j[k]||'—')}</p>`).join('')}<p><b>Notes:</b> ${esc(j.notes||'—')}</p></div></div><div class="panel"><h3>Change history</h3>${history.length?history.map(h=>`<div class="history"><b>${esc(h.type)}</b> · ${esc(h.who)}<br>${esc(h.detail)}<br><span class="muted">${esc(h.at)}</span></div>`).join(''):'<p class="muted">No changes recorded.</p>'}</div>`}
function approve(id){if(actor!=='Morgan')return;let j=data.jobs.find(x=>x.id===id);if(!j)return;j.review=false;j.reviewedAt=now();addEvent('Enquiry reviewed',j.number,'Morgan approved the enquiry for further work');save();render();toast('Enquiry marked reviewed')}
function changeStage(id){let j=data.jobs.find(x=>x.id===id),s=$('stage').value;if(j.column===s)return toast('No change');let previous=j.column;j.column=s;addEvent('Stage changed',j.number,`${previous} → ${s}`);if(actor==='John')notify('John changed job stage',j.number,`${previous} → ${s}`);if(['Manufacture Complete','At Galvanisers','At Powder Coaters','Ready for Installation'].includes(s))notify('Customer message approval needed',j.number,`Stage: ${s}. Any customer update must be approved by Morgan; nothing has been sent.`);save();render();toast('Job stage updated')}
function notifications(){return `<div class="titlebar"><h2>Notifications</h2><button class="secondary" onclick="markRead()">Mark all read</button></div><div class="panel">${actor==='John'?'<p class="muted">Owner alerts are shown to Morgan in this demo.</p>':data.notifications.length?data.notifications.map(n=>`<div class="notification ${n.read?'':'unread'}"><b>${esc(n.type)}</b><p>${esc(n.detail)}</p><p class="muted">${esc(n.at)} · ${esc(n.job)}</p><button class="secondary" onclick="openNotification('${n.id}')">Open job</button></div>`).join(''):'<div class="empty">No notifications yet.</div>'}</div><div class="notice">These are in-app demo alerts, not phone push notifications or emails. No customer messages are sent.</div>`}function markRead(){data.notifications.forEach(n=>n.read=true);save();render()}function openNotification(id){let n=data.notifications.find(x=>x.id===id);if(!n)return;n.read=true;save();let j=data.jobs.find(x=>x.number===n.job);setView(j?'detail':'jobs',j?.id)}
function customers(){let clients=[...new Set(data.jobs.map(j=>j.client).filter(Boolean))].sort();return `<h2>Customers</h2><div class="panel"><p class="muted">Customer directory generated from job cards.</p>${clients.length?clients.map(c=>`<div class="job"><b>${esc(c)}</b><p class="muted">${data.jobs.filter(j=>j.client===c).length} job(s)</p>${data.jobs.filter(j=>j.client===c).map(j=>`<button class="secondary" onclick="setView('detail','${j.id}')">${esc(j.number)}</button>`).join(' ')}</div>`).join(''):'<div class="empty">Customers appear here when you create jobs.</div>'}</div>`}
function render(){let pages={dashboard:dashboard,jobs:jobsPage,board,form,detail,notifications,customers};$('app').innerHTML=(pages[view]||dashboard)();$('nav').innerHTML=[['dashboard','Home','⌂'],['jobs','Jobs','▤'],['board','T-cards','▥'],['customers','Customers','♙'],['notifications','Alerts','♧']].map(([id,label,icon])=>`<button class="${view===id?'active':''}" onclick="setView('${id}')">${icon}<br>${label}${id==='notifications'&&data.notifications.some(n=>!n.read)?' •':''}</button>`).join('');$('actor').value=actor} $('actor').addEventListener('change',e=>{actor=e.target.value;setView('dashboard')});render();
</script></body></html>
